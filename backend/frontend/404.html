<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#FAF7F0">
  <title>Page Not Found | NEXmove Physio</title>
  <style>
    :root { color-scheme: light; --cream:#FAF7F0; --navy:#1B2A4A; --green:#5C7A5C; --gold:#B8894A; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--cream); color:var(--navy); font-family:Inter,Arial,Helvetica,sans-serif; line-height:1.6; }
    a { color:inherit; }
    a:focus-visible { outline:3px solid var(--gold); outline-offset:4px; }
    .skip-link { position:absolute; top:-60px; left:12px; padding:10px; background:#fff; z-index:2; }
    .skip-link:focus { top:12px; }
    header { border-bottom:1px solid #e3dccf; background:#f8f4ec; }
    .wrap { max-width:1120px; margin:0 auto; padding:0 24px; }
    .brand { display:inline-flex; align-items:center; gap:13px; text-decoration:none; padding:15px 0; font-family:Georgia,serif; font-size:24px; font-weight:600; }
    .brand img { width:54px; height:54px; object-fit:contain; }
    .brand small { display:block; font-family:Arial,sans-serif; font-size:10px; letter-spacing:4px; font-weight:700; line-height:1.4; }
    main { min-height:calc(100vh - 180px); display:grid; place-items:center; padding:70px 24px; }
    .content { max-width:650px; width:100%; text-align:center; }
    .eyebrow { color:var(--green); letter-spacing:3px; font-size:13px; font-weight:700; }
    h1 { font-family:Georgia,'Times New Roman',serif; font-size:clamp(36px,6vw,58px); line-height:1.12; margin:18px 0; font-weight:500; }
    p { max-width:520px; margin:0 auto 32px; font-size:16px; color:#46545c; }
    .actions { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:50px; padding:11px 24px; text-decoration:none; border-radius:40px; font-size:14px; font-weight:700; border:2px solid var(--navy); }
    .primary { color:#fff; background:var(--navy); }
    .secondary { color:var(--navy); background:transparent; }
    footer { padding:22px 24px; text-align:center; font-size:13px; border-top:1px solid #e3dccf; color:#55636b; }
    @media (max-width:480px) { .actions { flex-direction:column; } .button { width:100%; max-width:280px; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header><div class="wrap"><a class="brand" href="/" aria-label="NEXmove Physio home"><img src="/images/nexmove-logo.png" alt="" width="54" height="54"><span>NEXmove<small>PHYSIO</small></span></a></div></header>
  <main id="main">
    <div class="content">
      <div class="eyebrow">404 · PAGE NOT FOUND</div>
      <h1>We couldn't find this page.</h1>
      <p>The link may be outdated or the page may have moved. You can return to NEXmove Physio or book a home physiotherapy session.</p>
      <div class="actions"><a class="button primary" href="/">Return to home</a><a class="button secondary" href="/booking/">Book a session</a></div>
    </div>
  </main>
  <footer>NEXmove Physio · Professional care without leaving home</footer>
</body>
</html>
