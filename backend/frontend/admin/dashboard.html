<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal: #087f80;
            --teal-dark: #056566;
            --teal-light: #eaf7f6;
            --orange: #ed7147;
            --orange-dark: #d85d36;
            --navy: #182535;
            --text: #334052;
            --muted: #687486;
            --bg: #f5f8f8;
            --border: #e2e8e8;
            --white: #fff;
            --shadow: 0 14px 45px rgba(25, 48, 67, .09);
            --radius: 12px;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); }
        
        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in-down { animation: fadeInDown 0.5s ease-out forwards; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        .topbar {
            background: var(--white);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,.04);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .brand-logo {
            width: 42px; height: 42px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--teal-light);
            display: grid; place-items: center;
        }
        .brand-logo img { width: 100%; height: 100%; object-fit: contain; }
        .brand-text { display: flex; flex-direction: column; }
        .brand-name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 22px; line-height: 1; color: var(--navy); margin: 0;
        }
        .brand-name span { color: #5f776d; }
        .brand-sub { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }

        .topbar-right { display: flex; align-items: center; gap: 20px; }
        #welcomeMessage { font-size: 14px; font-weight: 500; color: var(--muted); }
        .logout-btn { 
            color: var(--teal); text-decoration: none; font-weight: 600; cursor: pointer; 
            padding: 8px 16px; border: 1.5px solid var(--teal); border-radius: 8px; transition: 0.3s; font-size: 14px;
        }
        .logout-btn:hover { background: var(--teal); color: var(--white); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(8, 127, 128, 0.2); }
        
        .container { max-width: 1300px; margin: 40px auto; padding: 0 20px; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(25, 48, 67, .05);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            opacity: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .stat:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(25, 48, 67, .08); }
        .stat:nth-child(1) { animation: fadeInDown 0.4s ease-out 0.1s forwards; border-bottom: 4px solid var(--navy); }
        .stat:nth-child(2) { animation: fadeInDown 0.4s ease-out 0.2s forwards; border-bottom: 4px solid var(--orange); }
        .stat:nth-child(3) { animation: fadeInDown 0.4s ease-out 0.3s forwards; border-bottom: 4px solid var(--teal); }
        .stat:nth-child(4) { animation: fadeInDown 0.4s ease-out 0.4s forwards; border-bottom: 4px solid #3b82f6; }
        .stat:nth-child(5) { animation: fadeInDown 0.4s ease-out 0.5s forwards; border-bottom: 4px solid #ef4444; }
        
        .stat-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px; height: 40px;
            border-radius: 10px;
            display: grid; place-items: center;
            opacity: 0.15;
            transition: opacity 0.3s;
        }
        .stat:hover .stat-icon { opacity: 0.8; }
        .stat-icon svg { width: 24px; height: 24px; }
        
        .stat-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; z-index: 2; }
        .stat .number { font-size: 36px; font-weight: 800; color: var(--navy); margin-top: 8px; line-height: 1; z-index: 2; }
        
        .filters { margin: 0 0 20px; display: flex; gap: 10px; flex-wrap: wrap; opacity: 0; animation: fadeInDown 0.4s ease-out 0.6s forwards; }
        .filters a {
            display: inline-block;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            background: var(--white);
            color: var(--navy);
            border: 1px solid var(--border);
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .filters a:hover { background: var(--teal-light); border-color: var(--teal); color: var(--teal-dark); transform: translateY(-1px); }
        .filters a.active { background: var(--teal); color: var(--white); border-color: var(--teal); box-shadow: 0 4px 10px rgba(8, 127, 128, .2); }
        
        .table-wrap {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            opacity: 0;
            animation: fadeIn 0.5s ease-out 0.7s forwards;
        }
        table { width: 100%; border-collapse: collapse; min-width: 1050px; }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { background: var(--teal-light); color: var(--teal-dark); font-weight: 600; font-size: 14px; letter-spacing: 0.5px; text-transform: uppercase; }
        tbody tr { transition: background 0.2s ease; }
        tbody tr:hover { background: #f8fafb; }
        td { font-size: 14px; color: var(--text); }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: #eef2f7;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge.pending { background: #fff5e6; color: var(--orange-dark); }
        .badge.confirmed { background: var(--teal-light); color: var(--teal-dark); }
        .badge.completed { background: #e0f2fe; color: #0284c7; }
        .badge.cancelled { background: #fee2e2; color: #dc2626; }
        
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .edit { background: var(--teal); }
        .edit:hover { background: var(--teal-dark); transform: translateY(-1px); }
        .delete { background: #ef4444; }
        .delete:hover { background: #dc2626; transform: translateY(-1px); }
        
        .empty { padding: 50px; text-align: center; color: var(--muted); font-size: 16px; font-weight: 500; }
        
        @media(max-width:900px){ .stats { grid-template-columns: repeat(2, 1fr); } }
        @media(max-width:520px){ 
            .stats { grid-template-columns: 1fr; }
            .topbar { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="topbar fade-in-down">
        <a href="../index.html" class="brand">
            <div class="brand-logo"><img src="../images/nexmove-logo.png" alt="Logo"></div>
            <div class="brand-text">
                <div class="brand-name">NEX<span>move</span></div>
                <div class="brand-sub">Dashboard</div>
            </div>
        </a>
        <div class="topbar-right">
            <div id="welcomeMessage">Welcome</div>
            <a id="logoutBtn" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat">
                <div class="stat-icon" style="background:var(--navy);color:#fff"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg></div>
                <div class="stat-title">Total Bookings</div>
                <div class="number" id="stat-total">-</div>
            </div>
            <div class="stat">
                <div class="stat-icon" style="background:var(--orange);color:#fff"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                <div class="stat-title">Pending</div>
                <div class="number" id="stat-pending">-</div>
            </div>
            <div class="stat">
                <div class="stat-icon" style="background:var(--teal);color:#fff"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>
                <div class="stat-title">Confirmed</div>
                <div class="number" id="stat-confirmed">-</div>
            </div>
            <div class="stat">
                <div class="stat-icon" style="background:#3b82f6;color:#fff"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                <div class="stat-title">Completed</div>
                <div class="number" id="stat-completed">-</div>
            </div>
            <div class="stat">
                <div class="stat-icon" style="background:#ef4444;color:#fff"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                <div class="stat-title">Cancelled</div>
                <div class="number" id="stat-cancelled">-</div>
            </div>
        </div>

        <div class="filters">
            <a onclick="loadAppointments('')" id="filter-all" class="active">All</a>
            <a onclick="loadAppointments('Pending')" id="filter-pending">Pending</a>
            <a onclick="loadAppointments('Confirmed')" id="filter-confirmed">Confirmed</a>
            <a onclick="loadAppointments('Completed')" id="filter-completed">Completed</a>
            <a onclick="loadAppointments('Cancelled')" id="filter-cancelled">Cancelled</a>
        </div>

        <div class="table-wrap">
            <table id="appointmentsTable" style="display:none;">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Contact</th>
                    <th>Service</th>
                    <th>Date / Time</th>
                    <th>Message</th>
                    <th>Status</th>
                    <th>Booked At</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            <div id="emptyState" class="empty">Loading appointments...</div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // Auth Check
        async function checkAuth() {
            if (!localStorage.getItem('nexmove_token')) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const res = await apiFetch('/api/auth/me');
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error('Not authenticated');
                }
                document.getElementById('welcomeMessage').textContent = `Welcome, ${data.admin.username}`;
            } catch (err) {
                localStorage.removeItem('nexmove_token');
                window.location.href = 'login.html';
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('nexmove_token');
            window.location.href = 'login.html';
        });

        // Load Stats
        async function loadStats() {
            try {
                const res = await apiFetch('/api/appointments/stats');
                const data = await res.json();
                if (data.success && data.data) {
                    document.getElementById('stat-total').textContent = data.data.total || 0;
                    document.getElementById('stat-pending').textContent = data.data.pending || 0;
                    document.getElementById('stat-confirmed').textContent = data.data.confirmed || 0;
                    document.getElementById('stat-completed').textContent = data.data.completed || 0;
                    document.getElementById('stat-cancelled').textContent = data.data.cancelled || 0;
                }
            } catch (err) {
                console.error('Failed to load stats', err);
            }
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }
        
        function formatTime(timeStr) {
            if (!timeStr) return '-';
            // If it's a text like "Morning (9am-12pm)", just return it
            if (timeStr.includes('(') || timeStr.length > 8) return timeStr;
            // Otherwise parse HH:MM
            const parts = timeStr.split(':');
            if (parts.length < 2) return timeStr;
            let hours = parseInt(parts[0], 10);
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours.toString().padStart(2, '0')}:${parts[1]} ${ampm}`;
        }

        function formatDateTime(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function escapeHTML(str) {
            if (!str) return '-';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            ).replace(/\n/g, '<br>');
        }

        // Load Appointments
        async function loadAppointments(status = '') {
            // Update filter UI
            document.querySelectorAll('.filters a').forEach(el => el.classList.remove('active'));
            if (status) {
                document.getElementById(`filter-${status.toLowerCase()}`).classList.add('active');
            } else {
                document.getElementById('filter-all').classList.add('active');
            }

            try {
                const url = status ? `/api/appointments?status=${status}` : '/api/appointments';
                const res = await apiFetch(url);
                const data = await res.json();
                
                const table = document.getElementById('appointmentsTable');
                const empty = document.getElementById('emptyState');
                const tbody = document.getElementById('tableBody');
                
                tbody.innerHTML = '';
                
                if (data.success && data.data && data.data.length > 0) {
                    empty.style.display = 'none';
                    table.style.display = 'table';
                    
                    data.data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.id}</td>
                            <td>${escapeHTML(row.name)}</td>
                            <td>${escapeHTML(row.email)}<br>${escapeHTML(row.phone)}</td>
                            <td>${escapeHTML(row.service)}</td>
                            <td>${formatDate(row.appointment_date)}<br>${formatTime(row.appointment_time)}</td>
                            <td>${escapeHTML(row.message)}</td>
                            <td><span class="badge ${escapeHTML(row.status.toLowerCase())}">${escapeHTML(row.status)}</span></td>
                            <td>${formatDateTime(row.created_at)}</td>
                            <td>
                                <div class="actions">
                                    <a class="btn edit" href="edit.html?id=${row.id}">Edit</a>
                                    <button class="btn delete" onclick="deleteAppointment(${row.id})">Delete</button>
                                </div>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    table.style.display = 'none';
                    empty.textContent = 'No appointments found.';
                    empty.style.display = 'block';
                }
            } catch (err) {
                console.error('Failed to load appointments', err);
            }
        }

        async function deleteAppointment(id) {
            if (!confirm('Delete this appointment?')) return;
            
            try {
                const res = await apiFetch(`/api/appointments/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadStats();
                    // Find which filter is active
                    const activeFilter = document.querySelector('.filters a.active');
                    const status = activeFilter.id === 'filter-all' ? '' : activeFilter.textContent;
                    loadAppointments(status);
                } else {
                    alert('Failed to delete appointment.');
                }
            } catch (err) {
                alert('Server error.');
            }
        }

        // Initialize
        checkAuth().then(() => {
            loadStats();
            loadAppointments();
        });
    </script>
</body>
</html>
