<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#1f2937}
        .topbar{
            background:#0d3b66;
            color:#fff;
            padding:18px 26px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
        }
        .topbar h1{margin:0;font-size:24px}
        .topbar a{color:#fff;text-decoration:none;font-weight:700;cursor:pointer}
        .container{max-width:1300px;margin:28px auto;padding:0 18px}
        .stats{
            display:grid;
            grid-template-columns:repeat(5,1fr);
            gap:14px;
            margin-bottom:24px;
        }
        .stat{
            background:#fff;
            border-radius:12px;
            padding:18px;
            box-shadow:0 5px 18px rgba(0,0,0,.06);
        }
        .stat .number{font-size:28px;font-weight:800;color:#0d3b66}
        .filters{margin:0 0 18px;display:flex;gap:8px;flex-wrap:wrap}
        .filters a{
            display:inline-block;
            text-decoration:none;
            padding:8px 12px;
            border-radius:7px;
            background:#fff;
            color:#0d3b66;
            border:1px solid #dbe4ee;
            cursor: pointer;
        }
        .filters a.active {
            background:#0d3b66;
            color:#fff;
        }
        .table-wrap{
            background:#fff;
            border-radius:12px;
            overflow:auto;
            box-shadow:0 5px 18px rgba(0,0,0,.06);
        }
        table{width:100%;border-collapse:collapse;min-width:1050px}
        th,td{padding:13px 12px;text-align:left;border-bottom:1px solid #e5e7eb;vertical-align:top}
        th{background:#eaf1f8;color:#0d3b66}
        .badge{
            display:inline-block;
            padding:5px 9px;
            border-radius:999px;
            font-size:12px;
            font-weight:700;
            background:#eef2f7;
        }
        .actions{display:flex;gap:6px;flex-wrap:wrap}
        .btn{
            display:inline-block;
            text-decoration:none;
            padding:7px 9px;
            border-radius:6px;
            font-size:12px;
            font-weight:700;
            color:#fff;
            cursor:pointer;
            border:none;
        }
        .edit{background:#2563eb}
        .delete{background:#dc2626}
        .empty{padding:30px;text-align:center;color:#64748b}
        @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:520px){.stats{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
    </style>
</head>
<body>
    <div class="topbar">
        <div>
            <h1>Appointment Admin Panel</h1>
            <div id="welcomeMessage">Welcome, ...</div>
        </div>
        <a id="logoutBtn">Logout</a>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat"><div>Total</div><div class="number" id="stat-total">-</div></div>
            <div class="stat"><div>Pending</div><div class="number" id="stat-pending">-</div></div>
            <div class="stat"><div>Confirmed</div><div class="number" id="stat-confirmed">-</div></div>
            <div class="stat"><div>Completed</div><div class="number" id="stat-completed">-</div></div>
            <div class="stat"><div>Cancelled</div><div class="number" id="stat-cancelled">-</div></div>
        </div>

        <div class="filters">
            <a onclick="loadAppointments('')" id="filter-all" class="active">All</a>
            <a onclick="loadAppointments('Pending')" id="filter-pending">Pending</a>
            <a onclick="loadAppointments('Confirmed')" id="filter-confirmed">Confirmed</a>
            <a onclick="loadAppointments('Completed')" id="filter-completed">Completed</a>
            <a onclick="loadAppointments('Cancelled')" id="filter-cancelled">Cancelled</a>
        </div>

        <div class="table-wrap">
            <table id="appointmentsTable" style="display:none;">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Contact</th>
                    <th>Service</th>
                    <th>Date / Time</th>
                    <th>Message</th>
                    <th>Status</th>
                    <th>Booked At</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            <div id="emptyState" class="empty">Loading appointments...</div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // Auth Check
        async function checkAuth() {
            if (!localStorage.getItem('nexmove_token')) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const res = await apiFetch('/api/auth/me');
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error('Not authenticated');
                }
                document.getElementById('welcomeMessage').textContent = `Welcome, ${data.admin.username}`;
            } catch (err) {
                localStorage.removeItem('nexmove_token');
                window.location.href = 'login.html';
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('nexmove_token');
            window.location.href = 'login.html';
        });

        // Load Stats
        async function loadStats() {
            try {
                const res = await apiFetch('/api/appointments/stats');
                const data = await res.json();
                if (data.success && data.data) {
                    document.getElementById('stat-total').textContent = data.data.total || 0;
                    document.getElementById('stat-pending').textContent = data.data.pending || 0;
                    document.getElementById('stat-confirmed').textContent = data.data.confirmed || 0;
                    document.getElementById('stat-completed').textContent = data.data.completed || 0;
                    document.getElementById('stat-cancelled').textContent = data.data.cancelled || 0;
                }
            } catch (err) {
                console.error('Failed to load stats', err);
            }
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }
        
        function formatTime(timeStr) {
            const [h, m] = timeStr.split(':');
            let hours = parseInt(h, 10);
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours.toString().padStart(2, '0')}:${m} ${ampm}`;
        }

        function formatDateTime(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function escapeHTML(str) {
            if (!str) return '-';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            ).replace(/\n/g, '<br>');
        }

        // Load Appointments
        async function loadAppointments(status = '') {
            // Update filter UI
            document.querySelectorAll('.filters a').forEach(el => el.classList.remove('active'));
            if (status) {
                document.getElementById(`filter-${status.toLowerCase()}`).classList.add('active');
            } else {
                document.getElementById('filter-all').classList.add('active');
            }

            try {
                const url = status ? `/api/appointments?status=${status}` : '/api/appointments';
                const res = await apiFetch(url);
                const data = await res.json();
                
                const table = document.getElementById('appointmentsTable');
                const empty = document.getElementById('emptyState');
                const tbody = document.getElementById('tableBody');
                
                tbody.innerHTML = '';
                
                if (data.success && data.data && data.data.length > 0) {
                    empty.style.display = 'none';
                    table.style.display = 'table';
                    
                    data.data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.id}</td>
                            <td>${escapeHTML(row.name)}</td>
                            <td>${escapeHTML(row.email)}<br>${escapeHTML(row.phone)}</td>
                            <td>${escapeHTML(row.service)}</td>
                            <td>${formatDate(row.appointment_date)}<br>${formatTime(row.appointment_time)}</td>
                            <td>${escapeHTML(row.message)}</td>
                            <td><span class="badge">${escapeHTML(row.status)}</span></td>
                            <td>${formatDateTime(row.created_at)}</td>
                            <td>
                                <div class="actions">
                                    <a class="btn edit" href="edit.html?id=${row.id}">Edit</a>
                                    <button class="btn delete" onclick="deleteAppointment(${row.id})">Delete</button>
                                </div>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    table.style.display = 'none';
                    empty.textContent = 'No appointments found.';
                    empty.style.display = 'block';
                }
            } catch (err) {
                console.error('Failed to load appointments', err);
            }
        }

        async function deleteAppointment(id) {
            if (!confirm('Delete this appointment?')) return;
            
            try {
                const res = await apiFetch(`/api/appointments/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadStats();
                    // Find which filter is active
                    const activeFilter = document.querySelector('.filters a.active');
                    const status = activeFilter.id === 'filter-all' ? '' : activeFilter.textContent;
                    loadAppointments(status);
                } else {
                    alert('Failed to delete appointment.');
                }
            } catch (err) {
                alert('Server error.');
            }
        }

        // Initialize
        checkAuth().then(() => {
            loadStats();
            loadAppointments();
        });
    </script>
</body>
</html>
