<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Appointment</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f3f6fa;margin:0;padding:30px}
        .card{max-width:600px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
        h1{color:#0d3b66}
        .row{margin:10px 0}
        .label{font-weight:bold}
        select{width:100%;padding:12px;margin-top:8px;border:1px solid #ccc;border-radius:7px}
        button{margin-top:15px;background:#0d3b66;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}
        a{color:#0d3b66}
        .error{background:#fee2e2;color:#991b1b;padding:10px;display:none;margin-bottom:15px;}
        .success{background:#eefbf2;color:#176b37;padding:10px;display:none;margin-bottom:15px;}
    </style>
</head>
<body>
<div class="card">
    <h1>Edit Appointment</h1>

    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>

    <div id="details" style="display:none;">
        <div class="row"><span class="label">Customer:</span> <span id="custName"></span></div>
        <div class="row"><span class="label">Service:</span> <span id="custService"></span></div>
        <div class="row">
            <span class="label">Appointment:</span>
            <span id="custDateTime"></span>
        </div>

        <form id="editForm">
            <label class="label" style="display:block;margin-top:15px;">Status</label>
            <select id="status" name="status">
                <option value="Pending">Pending</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
            </select>

            <button type="submit">Save Changes</button>
        </form>
    </div>
    
    <div id="loading">Loading appointment...</div>

    <p><a href="dashboard.html">← Back to dashboard</a></p>
</div>

<script src="../js/api.js"></script>
<script>
    // Auth Check
    if (!localStorage.getItem('nexmove_token')) {
        window.location.href = 'login.html';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    if (!id) {
        document.getElementById('loading').textContent = 'No ID provided.';
    } else {
        loadAppointment(id);
    }

    async function loadAppointment(id) {
        try {
            const res = await apiFetch(`/api/appointments/${id}`);
            const data = await res.json();
            
            if (res.ok && data.success) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('details').style.display = 'block';
                
                document.getElementById('custName').textContent = data.data.name;
                document.getElementById('custService').textContent = data.data.service;
                document.getElementById('custDateTime').textContent = `${data.data.appointment_date} ${data.data.appointment_time}`;
                document.getElementById('status').value = data.data.status;
            } else {
                document.getElementById('loading').textContent = data.message || 'Failed to load appointment.';
            }
        } catch (err) {
            document.getElementById('loading').textContent = 'Server error.';
        }
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        const status = document.getElementById('status').value;

        try {
            const res = await apiFetch(`/api/appointments/${id}`, {
                method: 'PUT',
                body: { status }
            });
            const data = await res.json();

            if (res.ok && data.success) {
                successMsg.textContent = 'Status updated successfully.';
                successMsg.style.display = 'block';
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } else {
                errorMsg.textContent = data.message || 'Update failed.';
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.textContent = 'Server error.';
            errorMsg.style.display = 'block';
        }
    });
</script>
</body>
</html>
