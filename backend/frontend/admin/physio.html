<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Physio Applications | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal: #087f80;
            --teal-dark: #056566;
            --teal-light: #eaf7f6;
            --orange: #ed7147;
            --orange-dark: #d85d36;
            --navy: #182535;
            --text: #334052;
            --muted: #687486;
            --bg: #f5f8f8;
            --border: #e2e8e8;
            --white: #fff;
            --shadow: 0 14px 45px rgba(25, 48, 67, .09);
            --radius: 12px;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); }
        
        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in-down { animation: fadeInDown 0.5s ease-out forwards; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        .topbar {
            background: var(--white);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,.04);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .brand-logo {
            width: 42px; height: 42px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--teal-light);
            display: grid; place-items: center;
        }
        .brand-logo img { width: 100%; height: 100%; object-fit: contain; }
        .brand-text { display: flex; flex-direction: column; }
        .brand-name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 22px; line-height: 1; color: var(--navy); margin: 0;
        }
        .brand-name span { color: #5f776d; }
        .brand-sub { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }

        .topbar-right { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; gap: 20px; margin-right: auto; margin-left: 40px; }
        .nav-links a { color: var(--navy); text-decoration: none; font-weight: 500; font-size: 15px; padding: 5px 10px; border-radius: 6px; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { background: var(--teal-light); color: var(--teal-dark); }
        #welcomeMessage { font-size: 14px; font-weight: 500; color: var(--muted); }
        .logout-btn { 
            color: var(--teal); text-decoration: none; font-weight: 600; cursor: pointer; 
            padding: 8px 16px; border: 1.5px solid var(--teal); border-radius: 8px; transition: 0.3s; font-size: 14px;
        }
        .logout-btn:hover { background: var(--teal); color: var(--white); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(8, 127, 128, 0.2); }
        
        .container { max-width: 1300px; margin: 40px auto; padding: 0 20px; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; opacity: 0; animation: fadeInDown 0.4s ease-out 0.2s forwards; }
        h1 { margin: 0; font-size: 24px; color: var(--navy); }

        .table-wrap {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            opacity: 0;
            animation: fadeIn 0.5s ease-out 0.4s forwards;
        }
        table { width: 100%; border-collapse: collapse; min-width: 1050px; }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { background: var(--teal-light); color: var(--teal-dark); font-weight: 600; font-size: 14px; letter-spacing: 0.5px; text-transform: uppercase; }
        tbody tr { transition: background 0.2s ease; }
        tbody tr:hover { background: #f8fafb; }
        td { font-size: 14px; color: var(--text); }
        
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: #eef2f7;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge.pending { background: #fff5e6; color: var(--orange-dark); }
        .badge.under-review { background: #fef08a; color: #854d0e; }
        .badge.approved { background: var(--teal-light); color: var(--teal-dark); }
        .badge.rejected { background: #fee2e2; color: #dc2626; }
        
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .edit { background: var(--teal); }
        .edit:hover { background: var(--teal-dark); transform: translateY(-1px); }
        
        .empty { padding: 50px; text-align: center; color: var(--muted); font-size: 16px; font-weight: 500; }
        
        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: #fff; padding: 30px; border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto;
        }
        .modal h2 { margin-top: 0; color: var(--navy); }
        .modal-details { margin-bottom: 20px; line-height: 1.6; }
        .modal-details p { margin: 8px 0; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-close { background: #cbd5e1; color: #1e293b; }
        .btn-close:hover { background: #94a3b8; }

        select.status-select { padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-family: inherit; font-size: 14px; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="topbar fade-in-down">
        <a href="../index.html" class="brand">
            <div class="brand-logo"><img src="../images/nexmove-logo.png" alt="Logo"></div>
            <div class="brand-text">
                <div class="brand-name">NEX<span>move</span></div>
                <div class="brand-sub">Dashboard</div>
            </div>
        </a>
        <div class="nav-links">
            <a href="dashboard.html">Appointments</a>
            <a href="physio.html" class="active">Physio Applications</a>
        </div>
        <div class="topbar-right">
            <div id="welcomeMessage">Welcome</div>
            <a id="logoutBtn" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="header-bar">
            <h1>Physiotherapist Applications</h1>
        </div>

        <div class="table-wrap">
            <table id="applicationsTable" style="display:none;">
                <thead>
                <tr>
                    <th>Ref</th>
                    <th>Applicant</th>
                    <th>Contact</th>
                    <th>City / Areas</th>
                    <th>Status</th>
                    <th>Applied At</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            <div id="emptyState" class="empty">Loading applications...</div>
        </div>
    </div>

    <!-- Modal for reviewing application -->
    <div class="modal-overlay" id="reviewModal">
        <div class="modal">
            <h2>Review Application</h2>
            <div class="modal-details" id="modalDetails"></div>
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border);">
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">Internal Notes:</label>
                <textarea id="updateNotes" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-family: inherit; font-size: 14px; min-height: 80px; margin-bottom: 15px;"></textarea>
                
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">Update Status:</label>
                <div style="display: flex; align-items: center;">
                    <select id="updateStatus" class="status-select">
                        <option value="Pending">Pending</option>
                        <option value="Under Review">Under Review</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                    <button class="btn edit" id="saveStatusBtn">Save</button>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-close" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // Auth Check
        async function checkAuth() {
            if (!localStorage.getItem('nexmove_token')) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const res = await apiFetch('/api/auth/me');
                const data = await res.json();
                if (!res.ok || !data.success) {
                    throw new Error('Not authenticated');
                }
                document.getElementById('welcomeMessage').textContent = `Welcome, ${data.admin.username}`;
            } catch (err) {
                localStorage.removeItem('nexmove_token');
                window.location.href = 'login.html';
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('nexmove_token');
            window.location.href = 'login.html';
        });

        function formatDateTime(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHTML(str) {
            if (!str) return '-';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            ).replace(/\n/g, '<br>');
        }
        
        function getBadgeClass(status) {
            return status.toLowerCase().replace(' ', '-');
        }

        let currentAppId = null;

        async function loadApplications() {
            try {
                const res = await apiFetch('/api/physio/admin');
                const data = await res.json();
                
                const table = document.getElementById('applicationsTable');
                const empty = document.getElementById('emptyState');
                const tbody = document.getElementById('tableBody');
                
                tbody.innerHTML = '';
                
                if (data.success && data.data && data.data.length > 0) {
                    empty.style.display = 'none';
                    table.style.display = 'table';
                    
                    data.data.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${escapeHTML(row.application_ref).substring(0,8)}...</td>
                            <td><strong>${escapeHTML(row.full_name)}</strong></td>
                            <td>${escapeHTML(row.email)}<br>${escapeHTML(row.phone)}</td>
                            <td>${escapeHTML(row.city)}</td>
                            <td><span class="badge ${getBadgeClass(row.status)}">${escapeHTML(row.status)}</span></td>
                            <td>${formatDateTime(row.created_at)}</td>
                            <td>
                                <button class="btn edit" onclick="viewApplication(${row.id})">Review</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    table.style.display = 'none';
                    empty.textContent = 'No applications found.';
                    empty.style.display = 'block';
                }
            } catch (err) {
                console.error('Failed to load applications', err);
            }
        }

        async function viewApplication(id) {
            try {
                const res = await apiFetch(`/api/physio/admin/${id}`);
                const data = await res.json();
                
                if (data.success && data.data) {
                    const app = data.data;
                    currentAppId = app.id;
                    
                    document.getElementById('modalDetails').innerHTML = `
                        <p><strong>Name:</strong> ${escapeHTML(app.full_name)}</p>
                        <p><strong>Email:</strong> ${escapeHTML(app.email)} | <strong>Phone:</strong> ${escapeHTML(app.phone)}</p>
                        <p><strong>City:</strong> ${escapeHTML(app.city)} | <strong>Preferred Contact:</strong> ${escapeHTML(app.preferred_contact)}</p>
                        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e2e8e8;">
                        <p><strong>HCPC Number:</strong> ${escapeHTML(app.hcpc_number)}</p>
                        <p><strong>Experience:</strong> ${app.years_experience !== null ? app.years_experience + ' years' : '-'}</p>
                        <p><strong>Specialisations:</strong> ${escapeHTML(app.specialisations)}</p>
                        <p><strong>Qualifications:</strong> ${escapeHTML(app.qualifications)}</p>
                        <p><strong>Biography:</strong> ${escapeHTML(app.biography)}</p>
                        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e2e8e8;">
                        <p><strong>Areas Covered:</strong> ${escapeHTML(app.areas_covered)}</p>
                        <p><strong>Availability:</strong> ${escapeHTML(app.preferred_days)} | ${escapeHTML(app.preferred_hours)}</p>
                        <p><strong>Home Visits:</strong> ${app.home_visit_availability ? 'Yes' : 'No'}</p>
                        <p><strong>Additional Info:</strong> ${escapeHTML(app.additional_info)}</p>
                    `;
                    
                    document.getElementById('updateStatus').value = app.status;
                    document.getElementById('updateNotes').value = app.internal_notes || '';
                    document.getElementById('reviewModal').style.display = 'flex';
                }
            } catch (err) {
                console.error('Failed to fetch application details', err);
                alert('Could not load application details.');
            }
        }

        function closeModal() {
            document.getElementById('reviewModal').style.display = 'none';
            currentAppId = null;
        }

        document.getElementById('saveStatusBtn').addEventListener('click', async () => {
            if (!currentAppId) return;
            const newStatus = document.getElementById('updateStatus').value;
            const newNotes = document.getElementById('updateNotes').value;
            
            try {
                const btn = document.getElementById('saveStatusBtn');
                btn.disabled = true;
                btn.textContent = 'Saving...';
                
                const res = await apiFetch(`/api/physio/admin/${currentAppId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ status: newStatus, internal_notes: newNotes })
                });
                
                if (res.ok) {
                    alert('Status updated successfully.');
                    closeModal();
                    loadApplications();
                } else {
                    alert('Failed to update status.');
                }
            } catch (err) {
                alert('Server error.');
            } finally {
                const btn = document.getElementById('saveStatusBtn');
                btn.disabled = false;
                btn.textContent = 'Save';
            }
        });

        // Initialize
        checkAuth().then(() => {
            loadApplications();
        });
    </script>
</body>
</html>
