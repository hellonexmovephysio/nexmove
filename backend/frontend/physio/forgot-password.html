<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Reset your NEXmove Practitioner Portal password.">
<title>Forgot Password | NEXmove Physio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<main class="portal-shell">
  <div class="portal-wrap">
    <div class="portal-brand">
      <img class="portal-logo" src="../images/nexmove-logo.png" alt="NEXmove Physio">
      <h1>Reset your password</h1>
      <p>Enter the email address registered to your practitioner account.</p>
    </div>
    <section class="portal-card">
      <div id="notice" class="notice" role="alert"></div>
      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button id="submitBtn" class="btn btn-primary" type="submit">Send reset link</button>
      </form>
      <div class="portal-links"><a href="index.html">← Back to sign in</a></div>
    </section>
  </div>
</main>
<script>
const form=document.getElementById('forgotForm'),notice=document.getElementById('notice'),btn=document.getElementById('submitBtn');
function show(message,type='success'){notice.textContent=message;notice.className='notice show '+type}
form.addEventListener('submit',async e=>{
  e.preventDefault();btn.disabled=true;btn.textContent='Sending…';
  try{
    const res=await fetch('/api/physio-auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});
    const data=await res.json();
    if(!res.ok) throw new Error(data.message||'Could not start password recovery.');
    show(data.message||'If an account exists, a reset link has been sent.');
    form.reset();
  }catch(err){show(err.message,'error')}finally{btn.disabled=false;btn.textContent='Send reset link'}
});
</script>
</body>
</html>
