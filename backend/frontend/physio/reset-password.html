<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Choose a new password for your NEXmove Practitioner Portal account.">
<title>Reset Password | NEXmove Physio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<main class="portal-shell">
  <div class="portal-wrap">
    <div class="portal-brand">
      <img class="portal-logo" src="../images/nexmove-logo.png" alt="NEXmove Physio">
      <h1>Choose a new password</h1>
      <p>Your reset link is valid for 60 minutes.</p>
    </div>
    <section class="portal-card">
      <div id="notice" class="notice" role="alert"></div>
      <form id="resetForm">
        <div class="form-group">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required>
          <div class="help">Use at least 10 characters.</div>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm new password</label>
          <input id="confirm_password" name="confirm_password" type="password" minlength="10" autocomplete="new-password" required>
        </div>
        <button id="submitBtn" class="btn btn-primary" type="submit">Reset password</button>
      </form>
      <div class="portal-links"><a href="index.html">← Back to sign in</a></div>
    </section>
  </div>
</main>
<script>
const token=new URLSearchParams(location.search).get('token')||'';
const form=document.getElementById('resetForm'),notice=document.getElementById('notice'),btn=document.getElementById('submitBtn');
function show(message,type='error'){notice.textContent=message;notice.className='notice show '+type}
if(!token){show('This password reset link is incomplete or invalid.');btn.disabled=true}
form.addEventListener('submit',async e=>{
  e.preventDefault();btn.disabled=true;btn.textContent='Resetting…';
  const payload=Object.fromEntries(new FormData(form));payload.token=token;
  try{
    const res=await fetch('/api/physio-auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!res.ok) throw new Error(data.message||'Could not reset your password.');
    show(data.message||'Password reset successfully.','success');
    setTimeout(()=>location.href='/physio/',1000);
  }catch(err){show(err.message)}finally{btn.disabled=false;btn.textContent='Reset password'}
});
</script>
</body>
</html>
